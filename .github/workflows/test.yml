name: ROM-free tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ROM-free tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    defaults:
      run:
        shell: pwsh
    env:
      KDC_REQUIRE_TERRAIN_CACHE_PRESSURE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, MIT
        with:
          persist-credentials: false

      - name: Install MinGW GCC
        if: runner.os == 'Windows'
        run: |
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { throw 'Git long-path setup failed.' }
          choco install mingw -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'MinGW install failed.' }
          'C:\ProgramData\mingw64\mingw64\bin' | Out-File $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Prepare the pinned test framework
        run: python tools/setup.py --framework-only

      - name: Run the ROM-free test suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
