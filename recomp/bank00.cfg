# Kirby Dream Course (USA) — LLE-first seed
# Regenerate with tools/regen.sh. Promote functions by editing recomp/symbols.toml
# and re-running the regen script, which rewrites the block below.
bank = 0
auto_vectors
tier_down_stubs

# Presentation observers for both $00 and its $80 ROM mirror. Keep these
# outside the generated symbol block. See docs/widescreen-sprites.md.
entry_hook 8823 KdcObserveSprites
entry_hook 8841 KdcObserveSprites
entry_hook 8ae1 KdcObserveSprites
entry_hook 82ca KdcObserveSprites
entry_hook 8c12 KdcObserveSprites
entry_hook e55e KdcObserveSprites
entry_hook e5a6 KdcObserveSprites
entry_hook e60b KdcObserveSprites
entry_hook e635 KdcObserveSprites
entry_hook 9e9e KdcObserveSprites
entry_hook 9eec KdcObserveSprites
entry_hook 8b09 KdcObserveSprites
entry_hook 8a3d KdcObserveSprites

# Reset vector $ff00, native NMI $ff06 (from the cartridge header).

# >>> BEGIN symbols.toml (generated — do not edit)
symbol 00ff00 I_RESET
force_lle 00ff00
symbol 00ff06 I_NMI
force_lle 00ff06
# <<< END symbols.toml
