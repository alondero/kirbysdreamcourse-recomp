plugins { id 'com.android.application' }

def nativeBuild = rootProject.file('../local/android-build')
def gameVersion = System.getenv('KDC_VERSION') ?: 'v0.0.0-dev'
def match = gameVersion =~ /^v(\d+)\.(\d+)\.(\d+)(?:-.*)?$/
if (!match.matches()) throw new GradleException('Expected vMAJOR.MINOR.PATCH[-suffix]')
def parts = (1..3).collect { match.group(it).toInteger() }
if (parts[1] > 999 || parts[2] > 999) throw new GradleException('Version component exceeds 999')

android {
    namespace 'io.github.alondero.kdc'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.alondero.kdc'
        minSdk 28
        targetSdk 35
        versionName gameVersion
        versionCode 1 + parts[0] * 1000000 + parts[1] * 1000 + parts[2]
    }
    signingConfigs {
        release {
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug' }
        release { signingConfig signingConfigs.release }
    }
    sourceSets.main {
        java.srcDir new File(nativeBuild, 'apk/sdl-java')
        jniLibs.srcDir new File(nativeBuild, 'apk/jniLibs')
        assets.srcDir new File(nativeBuild, 'apk/assets')
    }
    packagingOptions.jniLibs.useLegacyPackaging = true
}
